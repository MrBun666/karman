name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Поиск папки приложения
        run: |
          F=$(find . -path '*/www/js/version.js' -not -path '*/assets/*' | head -1)
          if [ -z "$F" ]; then
            echo "::error::Не найден файл www/js/version.js. Проверь, что папка www загружена в репозиторий целиком."
            find . -maxdepth 3 -not -path './.git*' | sort
            exit 1
          fi
          APP_DIR="${F%/www/js/version.js}"
          if [ ! -f "$APP_DIR/android/app/build.gradle" ]; then
            echo "::error::Рядом с папкой www нет android/app/build.gradle. Папки www и android должны лежать рядом."
            find . -maxdepth 3 -not -path './.git*' | sort
            exit 1
          fi
          echo "Папка приложения: $APP_DIR"
          echo "APP_DIR=$GITHUB_WORKSPACE/${APP_DIR#./}" >> "$GITHUB_ENV"

      - name: Подготовка (версия, файлы приложения, ключ подписи)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          AI_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          cd "$APP_DIR"
          VERSION=$(node -e "global.self={};require(process.cwd()+'/www/js/version.js');console.log(self.APP_VERSION)")
          echo "Версия: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

          ASSETS=android/app/src/main/assets
          rm -rf "$ASSETS/www" && mkdir -p "$ASSETS" && cp -r www "$ASSETS/www"
          printf "self.APP_BUILD = %s;\nself.APP_REPO = '%s';\n" "$GITHUB_RUN_NUMBER" "$GITHUB_REPOSITORY" > "$ASSETS/www/js/build-info.js"
          node -e "console.log('self.APP_AI_KEY = ' + JSON.stringify((process.env.AI_KEY || '').trim()) + ';')" >> "$ASSETS/www/js/build-info.js"
          if [ -z "$AI_KEY" ]; then echo "::warning::Нет секрета AI_API_KEY — ИИ заработает, только если вписать ключ в настройках приложения."; fi

          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/karman.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/karman.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          else
            echo "::warning::Нет секретов KEYSTORE_BASE64 / KEYSTORE_PASSWORD — APK подписан временным ключом, следующие версии не встанут поверх."
          fi

      - name: Сборка APK
        run: |
          cd "$APP_DIR"
          gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$APP_DIR"
          APK="karman-$VERSION-build$BUILD_NUMBER.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          node -e "global.self={};require(process.cwd()+'/www/js/version.js');console.log(self.APP_NOTES.map(n=>'- '+n).join('\n'))" > notes.md
          gh release create "build-$BUILD_NUMBER" "$APK" \
            --title "Карман $VERSION (сборка $BUILD_NUMBER)" \
            --notes-file notes.md
